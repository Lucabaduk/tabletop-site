<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fb;color:#1c2333}
a{color:#2563eb;text-decoration:none}.layout{display:flex;min-height:100vh}
nav{width:220px;background:#0f172a;color:#cbd5e1;padding:20px 12px;flex-shrink:0}nav h1{color:#fff;font-size:20px;margin:0 8px 4px}nav .dl{font-size:12px;margin:0 8px 20px;color:#94a3b8}
nav a{display:block;color:#cbd5e1;padding:10px 12px;border-radius:8px;margin-bottom:2px}nav a.active,nav a:hover{background:#1e293b;color:#fff}
nav .me{margin-top:30px;font-size:12px;padding:0 8px}main{flex:1;padding:28px;overflow:auto}
h2{margin:0 0 18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.stat .v{font-size:28px;font-weight:700}.stat .l{color:#64748b;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f6;font-size:14px}th{background:#f8fafc;color:#64748b;font-weight:600;font-size:12px;text-transform:uppercase}
input,select,textarea{padding:9px 10px;border:1px solid #d6dbe6;border-radius:8px;font:inherit;background:#fff}textarea{width:100%;min-height:70px}
button{padding:9px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.sec{background:#e2e8f0;color:#1c2333}button.danger{background:#dc2626}button.sm{padding:5px 9px;font-size:12px}
.badge{padding:3px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#e2e8f0}.available,.won,.completed{background:#dcfce7;color:#166534}.reserved,.negotiating,.test_drive,.scheduled{background:#fef9c3;color:#854d0e}.sold,.lost,.cancelled,.no_show{background:#fee2e2;color:#991b1b}.new,.contacted{background:#dbeafe;color:#1e40af}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:9}.modal .card{width:520px;max-width:95vw;max-height:90vh;overflow:auto}
.hidden{display:none!important}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#64748b;display:flex;flex-direction:column;gap:4px}.form .full{grid-column:1/-1}
.login{max-width:380px;margin:10vh auto}.login input{width:100%;margin-bottom:10px}.bar{height:10px;background:#2563eb;border-radius:4px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(160px,1fr));gap:10px;overflow:auto}.col{background:#e9edf5;border-radius:10px;padding:8px;min-height:120px}.col h4{margin:4px 4px 8px;font-size:12px;text-transform:uppercase;color:#475569}
.lead{background:#fff;border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}.muted{color:#64748b;font-size:12px}
.thumb{width:56px;height:38px;object-fit:cover;border-radius:6px;background:#e2e8f0}.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:8px}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px}.chart div{flex:1;text-align:center;font-size:11px;color:#64748b}.chart .b{background:#2563eb;border-radius:4px 4px 0 0;margin-bottom:4px}
:root{--brand:#c2410c}body{-webkit-font-smoothing:antialiased}nav{background:#1c1917}nav a.active,nav a:hover{background:#292524}
button{background:var(--brand)}button.green{background:#16a34a}button.wide,.wide{width:100%}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--brand)}
nav{display:flex;flex-direction:column}nav .links{flex:1}nav a{position:relative}nav a span{display:inline-block;width:24px}nav em{font-style:normal}
.dot{position:absolute;right:10px;top:9px;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}.dot.blue{background:#2563eb}
.tw{overflow-x:auto;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px}.tw table{box-shadow:none}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;background:var(--brand);color:#fff;text-align:center}.btn.sec{background:#e2e8f0;color:#1c2333}.btn.sm{padding:5px 9px;font-size:12px}
h3{margin:0 0 10px;font-size:16px}.between{justify-content:space-between}.end{justify-content:flex-end}.nomb{margin-bottom:0}.grow{flex:1}.center{text-align:center;justify-content:center}.nowrap{white-space:nowrap}.small{font-size:12px;margin:4px 0}

/* ===== polish pass (MacBook / Safari / Retina) ===== */
:root{color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
@media(min-width:761px){nav{position:-webkit-sticky;position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto;overscroll-behavior:contain}}
.layout{align-items:flex-start}main{min-width:0;align-self:stretch}
/* focus + hover states */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #ea580c;outline-offset:2px}
nav a:focus-visible{outline-color:#fdba74;outline-offset:-2px}
input:focus,select:focus,textarea:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.15);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
button,.btn,select{transition:filter .12s,background-color .12s,transform .06s,box-shadow .12s}
button:hover:not(:disabled):not(.item):not(.qc){filter:brightness(1.08)}button:active:not(:disabled){transform:translateY(1px)}
button.sec:hover:not(:disabled){filter:none;background:#cbd5e1}
select{cursor:pointer}input[type=checkbox],input[type=radio]{accent-color:#c2410c}
.item:hover:not(:disabled){box-shadow:0 3px 10px rgba(194,65,12,.18);transform:translateY(-1px)}
.tbl{transition:box-shadow .12s,transform .06s}.tbl:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}
table tr:hover td{background-color:rgba(15,23,42,.025)}table.sched tr:hover td,table.rt tr:hover td{background-color:transparent}
.card{box-shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04)}
/* spacing consistency */
.grid.two,.grid{margin-bottom:16px}.card+.card{margin-top:0}main>.card,main>.tw{margin-bottom:16px}
main>h2,main>.row.between>h2{letter-spacing:-.01em}
.dash-gap{margin-bottom:16px}
/* sizes + readability on Retina (min 11px, 28px targets, darker small gray text) */
.tag{font-size:11px}.chart span,.chart small,.chart>div>span{font-size:11px;color:#64748b}
.shift small,small{font-size:11px}
button.sm,.btn.sm,.chip{min-height:28px}
.addsh{min-height:26px;color:#64748b}
.muted,.stat .l{color:#5b6b82}
::placeholder{color:#8895a7}
/* toast */
.toast{box-shadow:0 8px 24px rgba(15,23,42,.28);font-size:14px;max-width:min(420px,calc(100vw - 40px));z-index:200}
/* schedule: fit 13" screens without a clipped last column */
table.sched th,table.sched td{min-width:78px;padding:8px 5px}table.sched td:first-child,table.sched th:first-child{min-width:120px}
.tw{-webkit-overflow-scrolling:touch}
/* modal */
#modal .card{max-height:calc(100vh - 40px);overflow:auto;overscroll-behavior:contain}
@media print{nav,.toast,#savewarn{display:none!important}main{padding:0}.rpt table{page-break-inside:auto}.rpt tr{page-break-inside:avoid}@page{margin:14mm}}
/* empty states */
p.empty{text-align:center;padding:22px 10px;font-size:14px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;margin:8px 0}
td.muted[colspan]{text-align:center;padding:28px 10px;font-size:14px}
.ttq-u{font-size:11px!important}
/* ===== quick-fix round ===== */
/* save-failed bar sits in the page flow (sticky) and pushes nav/content down instead of covering the logo */
:root{--wbh:0px}
.warnbar{position:-webkit-sticky;position:sticky;top:0}
@media(min-width:761px){nav{top:var(--wbh);height:calc(100vh - var(--wbh))}}
@media(max-width:760px){nav{top:var(--wbh)}}
/* POS ticket panel stays in view while the menu scrolls (main must not be its own scroll container here) */
body[data-page=pos] main{overflow:visible}
.pos-right{top:16px;max-height:calc(100vh - 32px);overflow-y:auto;align-self:start}
@media(max-width:1000px){.pos-right{max-height:none;overflow:visible}}
/* restock amount input */
input.tiny[data-restock-amt]{width:104px}
.backup-note{margin:10px 0 0;padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;color:#78350f}

<script>
/* ===== inlined module: modules/inventory.js ===== */
/*! TableTop Auto Inventory module (plain script, no dependencies, works offline).
 *  Exposes one global: window.TTInventory (or globalThis in node).
 *  Own localStorage key: "tabletop_inventory" (never touches orders/menu data).
 *  See INVENTORY_README.md for how to merge into TableTop.html. */
(function (root) {
  'use strict';
  var KEY = 'tabletop_inventory';
  var MAX_APPLIED = 500, MAX_LOG = 200;

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : 0; }
  function round(n) { return Math.round(n * 1000) / 1000; }
  function clean(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max || 60); }
  function fresh() { return { v: 1, seq: 1, ingredients: [], recipes: {}, applied: {}, deducted: {}, appliedOrder: [], log: [] }; }

  // ---------- state & persistence ----------
  var state = fresh();
  var saveError = '';          // non-empty when the last save failed
  var listeners = [];          // functions called after any change
  var store = function () { try { return root.localStorage || null; } catch (e) { return null; } };

  function load() {
    var s = store(), raw = null;
    if (!s) { saveError = 'localStorage is not available - inventory will not be saved.'; return; }
    try { raw = s.getItem(KEY); } catch (e) { saveError = 'Could not read saved inventory: ' + e.message; return; }
    if (!raw) return;
    try {
      var d = JSON.parse(raw), f = fresh();
      if (d && typeof d === 'object') {
        state = {
          v: 1, seq: +d.seq > 0 ? +d.seq : 1,
          ingredients: Array.isArray(d.ingredients) ? d.ingredients.filter(function (i) { return i && i.id; }) : [],
          recipes: d.recipes && typeof d.recipes === 'object' ? d.recipes : f.recipes,
          applied: d.applied && typeof d.applied === 'object' ? d.applied : f.applied,
          deducted: d.deducted && typeof d.deducted === 'object' ? d.deducted : f.deducted,
          appliedOrder: Array.isArray(d.appliedOrder) ? d.appliedOrder : f.appliedOrder,
          log: Array.isArray(d.log) ? d.log : f.log
        };
      }
    } catch (e) { saveError = 'Saved inventory was unreadable and was ignored: ' + e.message; state = fresh(); }
  }
  function save() {
    var s = store();
    if (!s) { saveError = 'localStorage is not available - inventory is NOT being saved.'; return false; }
    try { s.setItem(KEY, JSON.stringify(state)); saveError = ''; return true; }
    catch (e) { saveError = 'Could not save inventory (storage full or blocked): ' + (e && e.message || e); return false; }
  }
  function changed() { save(); for (var i = 0; i < listeners.length; i++) { try { listeners[i](); } catch (e) {} } }
  function log(msg) { state.log.unshift({ t: Date.now(), m: clean(msg, 200) }); if (state.log.length > MAX_LOG) state.log.length = MAX_LOG; }
  function find(id) { for (var i = 0; i < state.ingredients.length; i++) if (state.ingredients[i].id === id) return state.ingredients[i]; return null; }

  // ---------- ingredients / stock ----------
  function addIngredient(o) {
    var name = clean(o && o.name);
    if (!name) throw new Error('Ingredient name is required');
    var dup = state.ingredients.some(function (i) { return i.name.toLowerCase() === name.toLowerCase(); });
    if (dup) throw new Error('"' + name + '" already exists');
    var low = num(o.low), ing = {
      id: 'ing' + (state.seq++), name: name, unit: clean(o.unit, 12) || 'pcs',
      qty: num(o.qty), low: low, target: num(o.target) || low * 2
    };
    state.ingredients.push(ing); log('Added ' + name); changed(); return ing;
  }
  function updateIngredient(id, o) {
    var ing = find(id); if (!ing) throw new Error('Unknown ingredient');
    if (o.name !== undefined) { var n = clean(o.name); if (!n) throw new Error('Ingredient name is required'); ing.name = n; }
    if (o.unit !== undefined) ing.unit = clean(o.unit, 12) || ing.unit;
    if (o.qty !== undefined) ing.qty = num(o.qty);
    if (o.low !== undefined) ing.low = num(o.low);
    if (o.target !== undefined) ing.target = num(o.target);
    changed(); return ing;
  }
  function removeIngredient(id) {
    var ing = find(id); if (!ing) return;
    state.ingredients = state.ingredients.filter(function (i) { return i.id !== id; });
    Object.keys(state.recipes).forEach(function (k) {
      state.recipes[k].lines = state.recipes[k].lines.filter(function (l) { return l.ing !== id; });
      if (!state.recipes[k].lines.length) delete state.recipes[k];
    });
    log('Removed ' + ing.name); changed();
  }
  function restock(id, amount) {
    var ing = find(id); if (!ing) throw new Error('Unknown ingredient');
    var a = num(amount); if (!a) throw new Error('Enter an amount greater than 0');
    ing.qty = round(ing.qty + a); log('Restocked ' + ing.name + ' +' + a + ' ' + ing.unit); changed(); return ing;
  }
  function isLow(i) { return +i.qty <= +i.low; }
  function lowStock() { return state.ingredients.filter(isLow); }

  // ---------- recipes (menu item -> ingredients used per 1 sold) ----------
  // lines: [{ing: ingredientId, qty: number}]
  function setRecipe(itemId, itemName, lines) {
    var key = String(itemId), seen = {}, out = [];
    (lines || []).forEach(function (l) {
      var q = num(l.qty);
      if (!l.ing || !find(l.ing) || !q || seen[l.ing]) return;
      seen[l.ing] = 1; out.push({ ing: l.ing, qty: q });
    });
    if (!out.length) delete state.recipes[key];
    else state.recipes[key] = { name: clean(itemName, 80), lines: out };
    changed();
  }
  function getRecipe(itemId) { var r = state.recipes[String(itemId)]; return r ? r.lines.slice() : []; }

  // ---------- order hook ----------
  // order = {id, lines:[{item_id, name, qty}]} (TableTop's own order shape).
  // Safe to call repeatedly for the same order (e.g. ticket sent, edited, then paid):
  // only the DIFFERENCE since the last call is deducted (or returned to stock if lines were removed).
  function onOrderPlaced(order) {
    var res = { deducted: [], shortages: [], noRecipe: [], saved: true };
    if (!order || !Array.isArray(order.lines)) return res;
    var want = {}, names = {};
    order.lines.forEach(function (l) {
      if (l == null || l.item_id == null) return;
      var k = String(l.item_id), q = Math.max(0, Math.floor(+l.qty || 0));
      want[k] = (want[k] || 0) + q; names[k] = l.name;
    });
    var oid = order.id != null ? String(order.id) : null;
    var prev = (oid && state.applied[oid]) || {};
    var keys = {}; Object.keys(want).concat(Object.keys(prev)).forEach(function (k) { keys[k] = 1; });
    var used = {}; // ingredient id -> signed amount
    Object.keys(keys).forEach(function (k) {
      var delta = (want[k] || 0) - (prev[k] || 0); if (!delta) return;
      var r = state.recipes[k];
      if (!r) { if (delta > 0) res.noRecipe.push(names[k] || k); return; }
      r.lines.forEach(function (l) { used[l.ing] = (used[l.ing] || 0) + l.qty * delta; });
    });
    Object.keys(used).forEach(function (id) {
      var ing = find(id), amt = round(used[id]); if (!ing || !amt) return;
      var before = ing.qty, after = round(before - amt);
      if (after < 0) { res.shortages.push(ing.name); after = 0; }
      ing.qty = after;
      if (oid) { var dd = state.deducted[oid] || (state.deducted[oid] = {}); dd[id] = round((dd[id] || 0) + (before - after)); } // what really left stock
      res.deducted.push({ id: id, name: ing.name, amount: amt, unit: ing.unit, left: after, low: isLow(ing) });
    });
    if (oid) {
      if (!state.applied[oid]) state.appliedOrder.push(oid);
      state.applied[oid] = want;
      while (state.appliedOrder.length > MAX_APPLIED) { var old = state.appliedOrder.shift(); delete state.applied[old]; delete state.deducted[old]; }
    }
    if (res.deducted.length) log('Order ' + (oid || '') + ': used ' + res.deducted.map(function (d) { return d.name; }).join(', '));
    changed(); res.saved = !saveError; return res;
  }

  // ---------- void ----------
  // Call when a ticket is deleted/voided. Accepts the order object or its id.
  // Returns exactly what was deducted for that order back to stock. Idempotent; no-op for unknown orders.
  function onOrderVoided(orderOrId) {
    var res = { restored: [], saved: true };
    var oid = orderOrId != null && typeof orderOrId === 'object' ? orderOrId.id : orderOrId;
    if (oid == null) return res;
    oid = String(oid);
    if (!state.applied[oid] && !state.deducted[oid]) return res;
    var back = state.deducted[oid];
    if (!back) { // record from before per-ingredient tracking: rebuild from recipes
      back = {};
      Object.keys(state.applied[oid]).forEach(function (k) {
        var r = state.recipes[k]; if (!r) return;
        r.lines.forEach(function (l) { back[l.ing] = round((back[l.ing] || 0) + l.qty * state.applied[oid][k]); });
      });
    }
    Object.keys(back).forEach(function (id) {
      var ing = find(id), amt = round(back[id]); if (!ing || !amt) return; // ingredient deleted since: nothing to restore
      ing.qty = round(ing.qty + amt);
      res.restored.push({ id: id, name: ing.name, amount: amt, unit: ing.unit, left: ing.qty });
    });
    delete state.applied[oid]; delete state.deducted[oid];
    state.appliedOrder = state.appliedOrder.filter(function (x) { return x !== oid; });
    log('Order ' + oid + ' voided: ' + (res.restored.length ? 'returned ' + res.restored.map(function (d) { return d.amount + ' ' + d.unit + ' ' + d.name; }).join(', ') : 'nothing to return'));
    changed(); res.saved = !saveError; return res;
  }

  // ---------- shopping list ----------
  function shoppingList() {
    return lowStock().map(function (i) {
      var target = +i.target > +i.qty ? +i.target : (+i.low * 2 || +i.qty + 1);
      return { id: i.id, name: i.name, unit: i.unit, have: i.qty, buy: round(target - i.qty) };
    }).filter(function (x) { return x.buy > 0; });
  }
  function shoppingText(title) {
    var l = shoppingList();
    if (!l.length) return 'Nothing to buy - all ingredients are above their low-stock level.';
    return (title || 'Shopping list') + ' - ' + new Date().toLocaleDateString() + '\n' +
      l.map(function (x) { return '[ ] ' + x.name + ': ' + x.buy + ' ' + x.unit + ' (have ' + x.have + ')'; }).join('\n');
  }
  /* copyText(text, done): done(ok) is called once the result is known (clipboard promise resolved/rejected, then execCommand fallback). */
  function copyText(text, done) {
    function finish(ok) { if (done) { try { done(ok); } catch (e) {} } return ok; }
    function fallback() {
      try {
        var d = root.document, ta = d.createElement('textarea'); ta.value = text; d.body.appendChild(ta); ta.select();
        var ok = false; try { ok = !!d.execCommand('copy'); } catch (e2) {} d.body.removeChild(ta); return finish(ok);
      } catch (e) { return finish(false); }
    }
    try {
      if (root.navigator && root.navigator.clipboard && root.navigator.clipboard.writeText) {
        var p = root.navigator.clipboard.writeText(text);
        if (p && typeof p.then === 'function') { p.then(function () { finish(true); }, function () { fallback(); }); return; }
        return finish(true);
      }
    } catch (e) {}
    return fallback();
  }

  // ---------- import existing TableTop ingredients (optional, one-off) ----------
  // list = DB.ingredients: [{name, unit, qty, par}] ; skips names that already exist.
  function importIngredients(list) {

function lockView(){$('#app').innerHTML=`<div class="login card"><h2>🔒 ${esc(DB.settings.name)}</h2><p class="muted">Enter PIN to unlock TableTop</p><form id="lf"><input name="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus required><button class="wide">Unlock</button></form></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();if(e.target.pin.value===DB.settings.pin){sessionStorage.tt_unlocked='1';render();}else{toast('Wrong PIN');e.target.pin.value='';}};}
let timer=null;
function route(){if(!$('#main'))return;clearInterval(timer);try{TTInventory.unmount();}catch(e){}const r=(location.hash||'#dashboard').slice(1).split('/')[0];document.body.setAttribute('data-page',r);
 $$('nav a[data-r]').forEach(a=>a.classList.toggle('active',a.dataset.r===r));
 navBadges();
 (PAGE[r]||PAGE.dashboard)();}
window.addEventListener('hashchange',route);

// ---------- dashboard ----------
const PAGE={};
PAGE.qrcodes=()=>{TTQROrder.mountSheet($('#main'),{getTables:QRO.getTables,restaurantName:QRO.restaurantName,toast:toast,getPublishData:()=>DB});};
PAGE.dashboard=()=>{const paid=DB.orders.filter(o=>o.paid),today=ymd(Date.now());const tdy=paid.filter(o=>ymd(o.paid_at)===today);
 const T=os=>os.reduce((a,o)=>{const t=totals(o);a.sub+=t.sub-(t.disc||0);a.cost+=t.cost;a.tip+=t.tip;a.tax+=t.tax;return a;},{sub:0,cost:0,tip:0,tax:0});
 const tt=T(tdy),since=Date.now()-30*864e5,p30=paid.filter(o=>o.paid_at>=since),t30=T(p30);
 const hours=Array.from({length:24},(_,h)=>({h,v:0}));tdy.forEach(o=>hours[new Date(o.paid_at).getHours()].v+=totals(o).sub);
 const hs=hours.filter(x=>x.h>=10&&x.h<=23);
 const days=[];for(let i=29;i>=0;i--){const dd=new Date();dd.setDate(dd.getDate()-i);days.push({d:ymd(dd),v:0,n:0});}
 const dm=Object.fromEntries(days.map(x=>[x.d,x]));p30.forEach(o=>{const x=dm[ymd(o.paid_at)];if(x){x.v+=totals(o).sub;x.n++;}});
 const top=Object.create(null);p30.forEach(o=>o.lines.forEach(l=>{top[l.name]=top[l.name]||{q:0,v:0};top[l.name].q+=l.qty;top[l.name].v+=lineTotal(l);}));
 const tops=Object.entries(top).sort((a,b)=>b[1].q-a[1].q).slice(0,6),tmax=Math.max(1,...tops.map(x=>x[1].q));
 const open=DB.orders.filter(o=>!o.paid),low=lowStock(),resToday=DB.reservations.filter(r=>r.at.slice(0,10)===today&&r.status==='booked');
 const bars=(arr,lab,h=150)=>{const m=Math.max(1,...arr.map(x=>x.v));return`<div class="chart" style="height:${h+40}px">${arr.map(x=>`<div title="${esc(lab(x))}: ${money(x.v)}"><div class="b" style="height:${Math.max(x.v?2:0,x.v/m*h)}px"></div><span>${esc(lab(x,true))}</span></div>`).join('')}</div>`;};
 $('#main').innerHTML=`<div class="row between"><h2>Dashboard</h2><span class="muted">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</span></div>
 ${low.length?`<div class="alert">⚠️ <b>${low.length} ingredient${low.length>1?'s':''} low on stock:</b> ${low.map(i=>esc(i.name)).join(', ')} — <a href="#autoinv">review inventory</a></div>`:''}
 <div class="grid">
 <div class="card stat"><div class="v" id="k-sales">${money(tt.sub)}</div><div class="l">Today's sales (net, excl. tax &amp; tips)</div></div>
 <div class="card stat"><div class="v" id="k-orders">${tdy.length}</div><div class="l">Orders paid today · ${open.length} open</div></div>
 <div class="card stat"><div class="v">${money(tdy.length?tt.sub/tdy.length:0)}</div><div class="l">Average ticket today</div></div>
 <div class="card stat"><div class="v">${t30.sub?Math.round(t30.cost/t30.sub*1000)/10:0}%</div><div class="l">Food cost % (30 days) · tips today ${money(tt.tip)}</div></div></div>
 <div class="grid two"><div class="card"><h3>Sales by hour — today</h3>${tdy.length?bars(hs,(x,s)=>s?(x.h%12||12)+(x.h<12?'a':'p'):x.h+':00'):'<p class="muted empty">No paid orders yet today.</p>'}</div>

function normTime(s){const m=/^\s*(\d{1,2})(?::(\d{1,2}))?\s*$/.exec(typeof s==='string'||typeof s==='number'?String(s):'');if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}

const hm=s=>{const n=normTime(s);if(!n)return 0;const[h,m]=n.split(':');return+h*60+ +m;};

const shiftAbs=s=>{if(!timeOk(s.start)||!timeOk(s.end))return[NaN,NaN];const base=new Date(s.date+'T00:00:00').getTime();const a=base+hm(s.start)*60000;let b=base+hm(s.end)*60000;if(b<=a)b+=864e5;return[a,b];};
const overlaps=(a,b)=>{const[a1,a2]=shiftAbs(a),[b1,b2]=shiftAbs(b);return a1<b2&&b1<a2;};
const clashes=s=>DB.shifts.filter(o=>o.id!==s.id&&o.staff_id==s.staff_id&&overlaps(s,o));

m, give an honest wait time, and offer a seat at the bar if possible", "Give their table away", "Ask them to leave and come back"], "answer": 1}];

const sample=(a,n)=>shuffle(a).slice(0,n);
function mkChoices(correct,pool,n){const w=sample([...new Set(pool.filter(x=>x!==correct))],n-1);if(!w.length)return null;const ch=shuffle([correct,...w]);return{choices:ch,a:ch.indexOf(correct)};}
function menuQuestions(){const out=[],cnt=new Map();DB.items.forEach(i=>{const k=String(i.name).trim().toLowerCase();cnt.set(k,(cnt.get(k)||0)+1);});const items=DB.items.filter(i=>cnt.get(String(i.name).trim().toLowerCase())===1),cats=DB.categories.map(c=>c.name);const prices=[...new Set(items.map(i=>money(i.price)))];
 const allMods=[...new Set(items.flatMap(x=>parseMods(x.mods).map(m=>m.n)))];const modPrices=[...new Set([...items.flatMap(x=>parseMods(x.mods).map(m=>m.p)).filter(p=>p>0),1,2,3,4,5])].map(money);
 const tmap=new Map();[...STDTAGS,...items.flatMap(tagArr)].forEach(x=>{const k=tkey(x);if(k&&!tmap.has(k))tmap.set(k,canonTag(x));});const allTags=[...tmap.values()];
 const push=(t,q,c,extra={})=>{if(c)out.push({t,q,choices:c.choices,a:c.a,...extra});};
 items.forEach(it=>{const full=c=>c&&c.choices.length===4?c:null;
  push('price',`How much is the ${it.name}?`,full(mkChoices(money(it.price),prices,4)));

  push('soldout',`Is the ${it.name} currently sold out (86’d)?`,{choices:['Yes — it is sold out','No — it is available'],a:it.available?1:0},{soldout:!it.available});

 for(let k=0;k<3;k++){const four=sample(items,4);if(four.length===4&&new Set(four.map(i=>i.price)).size===4){const top=four.slice().sort((a,b)=>b.price-a.price)[0];push('maxprice','Which of these costs the most?',{choices:four.map(i=>i.name),a:four.indexOf(top)});}}

function buildRound(){const fixed=shuffle(QF.map(f=>{const ans=f.choices[f.answer],ch=shuffle(f.choices);return{t:'service',q:f.q,choices:ch,a:ch.indexOf(ans)};}));

 const types=shuffle(Object.keys(groups));types.forEach(t=>{groups[t]=shuffle(groups[t]);if(t==='soldout')groups[t].sort((a,b)=>(b.soldout?1:0)-(a.soldout?1:0));});
 const want=Math.min(10,Math.max(10-3,10-fixed.length)),menu=[];const seen=new Set();

function importQROrder(order){reloadDB();
 if(!order||!Array.isArray(order.lines)||!order.lines.length)return false;
 if(DB.orders.some(o=>o.qr_id===order.id||(o.qr_ids||[]).includes(order.id)))return true;

 return okSaved;}
// soft two-note sine chimes: 'order' rises (E5->A5), 'call' falls (G5->D5). ~0.4s, gain 0.15, once per new item; respects Settings → New order alert sound
let ttAC=null;const TT_CHIMES={order:[659.25,880],call:[783.99,587.33]};
function ttChime(kind){if(DB&&DB.settings&&DB.settings.kds_sound===false)return false;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;ttAC=ttAC||new A();const c=ttAC;if(c.state==='suspended'&&c.resume)c.resume();const t=c.currentTime;
 (TT_CHIMES[kind]||TT_CHIMES.order).forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),d=i*0.16;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.15,t+d+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.24);o.start(t+d);o.stop(t+d+0.26);});return true;}catch(e){return false;}}
function qrBeep(){return ttChime('order');}
// one chime per NEW order/call (never a loop); if something stays unacknowledged, at most one gentle reminder every 60 s
const TTA={seen:{},last:0,init:false,REMIND:60000};
function ttAlertTick(now){now=now||Date.now();const items=[...(QRP.pending||[]).map(o=>['order','o'+o.id]),...(QRP.calls||[]).filter(c=>c.status!=='acked').map(c=>['call','c'+c.id])];
 const fresh=items.filter(([,k])=>!TTA.seen[k]);const keep={};items.forEach(([,k])=>keep[k]=1);TTA.seen=keep;
 if(!TTA.init){TTA.init=true;if(!fresh.length)return 0;}
 if(fresh.length){fresh.forEach(([kind],i)=>i?setTimeout(()=>ttChime(kind),i*600):ttChime(kind));TTA.last=now;return fresh.length;}
 if(items.length&&now-TTA.last>=TTA.REMIND){ttChime(items.some(([k])=>k==='call')?'call':'order');TTA.last=now;return 1;}return 0;}
// "Check, please" is not its own type on the server: the guest page sends it as the call's free-text reason. Anything mentioning check/bill counts as Check please; everything else is Waiter.
function callKind(c){return/\b(check|bill)\b/i.test(String(c&&c.reason||''))?'Check please':'Waiter';}
function ttBadge(n,cls){n=+n||0;return n>0?`<b class="dot ${cls||''}" aria-label="${n} waiting">${n>99?'99+':n}</b>`:'';}
function navBadges(){const low=(typeof lowStock==='function'?lowStock().length:0),kit=DB.orders.filter(o=>!o.paid&&o.status!=='served').length+qrPendN(),calls=qrStaff()?(QRP.calls||[]).filter(c=>c.status!=='acked').length:0;
 $$('nav a[data-r]').forEach(a=>{a.querySelectorAll('.dot').forEach(b=>b.remove());const r=a.dataset.r;if(r==='autoinv')a.insertAdjacentHTML('beforeend',ttBadge(low,'warn'));if(r==='kitchen')a.insertAdjacentHTML('beforeend',ttBadge(kit)+ttBadge(calls,'call'));});}
const qrAutoRej={};function qrRejectOld(list){const w=(+DB.settings.kds_pending_clear>0?+DB.settings.kds_pending_clear:180)*60000,now=Date.now();return list.filter(o=>{if(!(o&&o.created_at&&now-o.created_at>=w))return true;if(!qrAutoRej[o.id]){qrAutoRej[o.id]=1;TTQROrder.rejectOrder(o.id,'Not accepted in time').then(r=>{if(!r||!r.ok)delete qrAutoRej[o.id];},()=>{delete qrAutoRej[o.id];});}return false;});}
function qrSyncReady(list){if(!Array.isArray(list)||!list.length)return;let ch=false;list.forEach(r=>{const o=DB.orders.find(x=>x.qr_id===r.id);if(o&&!o.qr_ready){o.qr_ready=1;ch=true;}});if(ch)save();}
function qrCallsHtml(){const c=(QRP.calls||[]);if(!c.length)return'';const open=c.filter(x=>x.status!=='acked').length;return`<div class="qrcalls" role="alert"><h4>Tables calling ${ttBadge(open,'inl')}</h4>${c.map(x=>{const k=callKind(x),rs=String(x.reason||'').trim();return`<div class="qrcall row between nomb"><span><b>${esc(x.table_name||('Table '+x.table_id))}</b> · ${esc(k)}${rs&&k==='Waiter'?` <span class="muted">(${esc(rs)})</span>`:''} <span class="muted">${x.status==='acked'?'· on the way':'· waiting'}</span></span><span class="row nomb">${x.status!=='acked'?`<button class="sm" data-qcack="${esc(x.id)}">Ack</button>`:''}<button class="sm sec" data-qcclr="${esc(x.id)}">Clear</button></span></div>`;}).join('')}</div>`;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-qready],[data-qcack],[data-qcclr]');if(!b||b.disabled)return;b.disabled=true;
 if(b.dataset.qready){const o=byId('orders',+b.dataset.qready);if(!o||!o.qr_id){b.disabled=false;return;}TTQROrder.readyOrder(o.qr_id).then(r=>{if(!r.ok){b.disabled=false;return toast(r.message||'Could not mark ready');}o.qr_ready=1;if(o.status==='new'||o.status==='cooking')o.status='ready';save();toast('Guest told: order ready');route();});return;}
 const id=b.dataset.qcack||b.dataset.qcclr,ack=!!b.dataset.qcack;(ack?TTQROrder.ackCall(id):TTQROrder.clearCall(id)).then(r=>{if(!r.ok&&r.status!==404){b.disabled=false;return toast(r.message||'Could not update call');}

function qrOnUpdate(i){QRP.pending=qrRejectOld(i.pending||[]);qrSyncReady(i.ready);QRP.calls=(i.calls||[]).filter(c=>c&&c.id);QRP.err='';

function qrQueue(){try{return JSON.parse(localStorage.getItem(QR_CLOSEQ_KEY))||[];}catch(e){return[];}}

function qrCloseOne(id,outcome){return TTQROrder.closeOrder(id,outcome).then(r=>{

function qrClose(o,outcome){if(!qrStaff()||!o)return;const ids=o.qr_ids||(o.qr_id?[o.qr_id]:[]);ids.forEach(id=>{qrCloseOne(id,outcome).then(done=>{if(!done){const q=qrQueue();q.push({id,outcome});qrQueueSave(q);}});});}

function qrWaitHtml(){if(qrOn()&&!qrToken())return`<div id="qrwait" class="qrwait"><div class="qrerr" role="status">📱 Guest phone orders will NOT show on this device: no staff token. Add it in <a href="#settings">Settings → Shared server</a>.</div></div>`;if(!qrStaff())return'';const now=Date.now(),list=QRP.pending.filter(o=>!o.expires_at||o.expires_at>now);

function qrWaitInner(list){const err=qrCallsHtml()+(QRP.err?`<div class="qrerr" role="alert">⚠️ ${esc(QRP.err)}</div>`:'');

  <div class="row nomb"><button class="sm green grow" data-qracc="${esc(o.id)}">Accept</button><button class="sm danger" data-qrrej="${esc(o.id)}">Reject</button></div></div>`;}).join('');}

const reloadDB=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items)&&d.settings){DB=d;migrate();}}catch(e){}};
const QRO=TTQROrder.tableTopAdapter({getDB:()=>DB,save:save,nid:nid,reload:reloadDB});
window.addEventListener('storage',e=>{if(e.key===TTRegulars.KEY){try{TTRegulars.reload();}catch(x){}if((location.hash||'').startsWith('#reservations')&&$('#main')&&$('#modal').classList.contains('hidden'))route();return;}if(e.key===TTInventory.KEY){try{TTInventory.reload();}catch(x){}if((location.hash||'').startsWith('#autoinv')&&$('#main'))route();return;}if(e.key!==KEY||TTQROrder.isCustomerHash())return;reloadDB();
  if(['dashboard','kitchen','tables','orders'].includes((location.hash||'#dashboard').slice(1).split('/')[0])&&$('#main'))route();});
qrConfigure();   // setServer BEFORE autoStart (no-op while QR_SERVER_URL is empty)
if(!TTQROrder.autoStart({container:$('#app'),getMenu:QRO.getMenu,getTable:QRO.getTable,
  placeOrder:(tid,items,meta)=>{const r=QRO.placeOrder(tid,items,meta);try{TTInventory.onOrderPlaced(byId('orders',r.orderId));}catch(e){}return r;},
  restaurantName:QRO.restaurantName,taxRate:QRO.taxRate,onLeave:()=>{location.hash='#tables';render();}}))render();

// Service worker is OFF for now (no sw.js on the site). To turn it back on: set ENABLE_SW=true and add a matching worker-src to the CSP.
const ENABLE_SW=false;
try{TTMobile.init({registerSW:ENABLE_SW});}catch(e){console.warn('mobile init',e);}

</script></body></html>
